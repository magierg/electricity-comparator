name: OpenCode PR

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: read
  id-token: write

concurrency:
  group: opencode-pr-${{ github.event.issue.number }}
  cancel-in-progress: false

env:
  HUSKY: 0
  GIT_TERMINAL_PROMPT: 0
  GH_TOKEN: ${{ github.token }}
  OPENCODE_CONFIG: ${{ github.workspace }}/opencode.pipeline.json

jobs:
  review:
    if: |
      github.event.issue.pull_request != null &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR') &&
      (startsWith(github.event.comment.body, '/oc review') ||
       startsWith(github.event.comment.body, '/opencode review'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: opencode-pr
    steps:
      - name: Inspect pull request
        id: pr
        run: |
          gh pr view "${{ github.event.issue.number }}" \
            --repo "$GITHUB_REPOSITORY" \
            --json headRefOid,baseRefName,isCrossRepository \
            --jq '"head_sha=\(.headRefOid)\nbase=\(.baseRefName)\ncross=\(.isCrossRepository)"' >> "$GITHUB_OUTPUT"

      - name: Refuse fork pull requests
        if: steps.pr.outputs.cross == 'true'
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "$GITHUB_REPOSITORY" \
            --body "OpenCode PR commands are limited to branches in this repository. Fork pull requests need a manual review."

      - name: Reject commands older than the PR head
        if: steps.pr.outputs.cross == 'false'
        run: |
          pushed_at=$(gh api "repos/$GITHUB_REPOSITORY/commits/${{ steps.pr.outputs.head_sha }}" --jq '.commit.committer.date')
          comment_at="${{ github.event.comment.created_at }}"
          if [ "$(date -d "$pushed_at" +%s)" -gt "$(date -d "$comment_at" +%s)" ]; then
            gh issue comment "${{ github.event.issue.number }}" \
              --repo "$GITHUB_REPOSITORY" \
              --body "The pull request changed after this command was posted. Re-run the command after the latest push."
            exit 1
          fi

      - name: Checkout pull request
        if: steps.pr.outputs.cross == 'false'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify trusted agent configuration
        if: steps.pr.outputs.cross == 'false'
        run: |
          git fetch origin "${{ steps.pr.outputs.base }}" --depth=1
          base_sha=$(git rev-parse FETCH_HEAD)
          if ! git diff --quiet "$base_sha" HEAD -- opencode.pipeline.json opencode.json AGENTS.md .opencode; then
            gh issue comment "${{ github.event.issue.number }}" \
              --repo "$GITHUB_REPOSITORY" \
              --body "Agent configuration changed in this pull request. Run the review or fix manually after reviewing the configuration diff."
            exit 1
          fi

      - name: Setup Node
        if: steps.pr.outputs.cross == 'false'
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        if: steps.pr.outputs.cross == 'false'
        run: npm ci

      - name: Run OpenCode reviewer
        if: steps.pr.outputs.cross == 'false'
        uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode-go/deepseek-v4.1-flash
          agent: reviewer
          share: false

  fix:
    if: |
      github.event.issue.pull_request != null &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR') &&
      (startsWith(github.event.comment.body, '/oc fix checks') ||
       startsWith(github.event.comment.body, '/opencode fix checks'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: opencode-pr
    steps:
      - name: Inspect pull request
        id: pr
        run: |
          gh pr view "${{ github.event.issue.number }}" \
            --repo "$GITHUB_REPOSITORY" \
            --json headRefOid,baseRefName,isCrossRepository \
            --jq '"head_sha=\(.headRefOid)\nbase=\(.baseRefName)\ncross=\(.isCrossRepository)"' >> "$GITHUB_OUTPUT"

      - name: Refuse fork pull requests
        if: steps.pr.outputs.cross == 'true'
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "$GITHUB_REPOSITORY" \
            --body "OpenCode PR commands are limited to branches in this repository. Fork pull requests need a manual fix."

      - name: Reject commands older than the PR head
        if: steps.pr.outputs.cross == 'false'
        run: |
          pushed_at=$(gh api "repos/$GITHUB_REPOSITORY/commits/${{ steps.pr.outputs.head_sha }}" --jq '.commit.committer.date')
          comment_at="${{ github.event.comment.created_at }}"
          if [ "$(date -d "$pushed_at" +%s)" -gt "$(date -d "$comment_at" +%s)" ]; then
            gh issue comment "${{ github.event.issue.number }}" \
              --repo "$GITHUB_REPOSITORY" \
              --body "The pull request changed after this command was posted. Re-run the command after the latest push."
            exit 1
          fi

      - name: Checkout pull request
        if: steps.pr.outputs.cross == 'false'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify trusted agent configuration
        if: steps.pr.outputs.cross == 'false'
        run: |
          git fetch origin "${{ steps.pr.outputs.base }}" --depth=1
          base_sha=$(git rev-parse FETCH_HEAD)
          if ! git diff --quiet "$base_sha" HEAD -- opencode.pipeline.json opencode.json AGENTS.md .opencode; then
            gh issue comment "${{ github.event.issue.number }}" \
              --repo "$GITHUB_REPOSITORY" \
              --body "Agent configuration changed in this pull request. Run the review or fix manually after reviewing the configuration diff."
            exit 1
          fi

      - name: Setup Node
        if: steps.pr.outputs.cross == 'false'
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        if: steps.pr.outputs.cross == 'false'
        run: npm ci

      - name: Cache Playwright browsers
        if: steps.pr.outputs.cross == 'false'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browser
        if: steps.pr.outputs.cross == 'false'
        run: npx playwright install --with-deps chromium

      - name: Run OpenCode babysitter
        if: steps.pr.outputs.cross == 'false'
        uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode-go/deepseek-v4.1-flash
          agent: babysitter
          share: false
