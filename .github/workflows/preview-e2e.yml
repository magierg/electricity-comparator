name: Preview e2e

on:
  deployment_status:

permissions:
  contents: read

concurrency:
  group: preview-e2e-${{ github.event.deployment.sha }}
  cancel-in-progress: true

jobs:
  preview-e2e:
    if: |
      github.event.deployment_status.state == 'success' &&
      startsWith(github.event.deployment.environment, 'Preview') &&
      (github.event.deployment_status.environment_url != '' || github.event.deployment_status.target_url != '')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout preview commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.deployment.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright against preview
        env:
          E2E_BASE_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
          CI: true
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: preview-playwright-report
          path: playwright-report/
          retention-days: 30
