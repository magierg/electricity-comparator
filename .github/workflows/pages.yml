name: Agent SDLC page

on:
  push:
    branches: [main]
    paths:
      - 'public/agent-sdlc/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify page source
        run: test -f public/agent-sdlc/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload page
        uses: actions/upload-pages-artifact@v5
        with:
          path: public/agent-sdlc

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
